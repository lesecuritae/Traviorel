name: traviorel

services:
  secret-init:
    image: ghcr.io/lesecuritae/traviorel-app:latest
    build:
      context: ./tool
      args:
        TRVL_REF: ${TRVL_REF:-v1.21.4}
    command: ["python", "/app/init_db_cffi_token.py"]
    user: "0:0"
    environment:
      DB_CFFI_TOKEN: "${DB_CFFI_TOKEN:-}"
      DB_CFFI_TOKEN_FILE: /run/traviorel-secrets/db_cffi_token
    volumes:
      - traviorel-secrets:/run/traviorel-secrets
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db-api:
    image: ghcr.io/lesecuritae/traviorel-db-api:latest
    build:
      context: ./db-api
    container_name: traviorel-db-api
    environment:
      PORT: "3001"
      USER_AGENT: traviorel/0.3.0
      DB_CFFI_BRIDGE_URL: http://app:8000/internal/db-cffi/request
      DB_CFFI_TOKEN: "${DB_CFFI_TOKEN:-}"
      DB_CFFI_TOKEN_FILE: /run/traviorel-secrets/db_cffi_token
      DBNAV_MAX_CONCURRENCY: "2"
      DBNAV_BLOCK_TTL_MS: "30000"
      DB_REQUEST_TIMEOUT_MS: "18000"
      DB_SPLIT_TIMEOUT_MS: "45000"
      DB_SPLIT_REQUEST_TIMEOUT_MS: "12000"
    networks:
      - reisevergleich
    volumes:
      - traviorel-secrets:/run/traviorel-secrets:ro
    group_add:
      - "10001"
    depends_on:
      secret-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    image: ghcr.io/lesecuritae/traviorel-app:latest
    build:
      context: ./tool
      args:
        TRVL_REF: ${TRVL_REF:-v1.21.4}
    container_name: traviorel-app
    depends_on:
      secret-init:
        condition: service_completed_successfully
      db-api:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      APP_TIMEZONE: Europe/Berlin
      DB_API_URL: http://db-api:3001
      DB_CFFI_TOKEN: "${DB_CFFI_TOKEN:-}"
      DB_CFFI_TOKEN_FILE: /run/traviorel-secrets/db_cffi_token
      REISE_CACHE_DB: /var/lib/reisevergleich/cache.sqlite3
      HISTORY_ENABLED: "${HISTORY_ENABLED:-true}"
      HISTORY_CACHE_DIR: "${HISTORY_CACHE_DIR:-/var/lib/reisevergleich/history}"
      HISTORY_CACHE_MAX_GB: "${HISTORY_CACHE_MAX_GB:-5}"
      HISTORY_REMOTE_TIMEOUT: "${HISTORY_REMOTE_TIMEOUT:-60}"
      HISTORY_ENRICH_TIMEOUT: "${HISTORY_ENRICH_TIMEOUT:-8}"
      HISTORY_MAX_CONCURRENCY: "${HISTORY_MAX_CONCURRENCY:-2}"
      HISTORY_STATS_TTL: "${HISTORY_STATS_TTL:-86400}"
      HISTORY_DEFAULT_WINDOW_DAYS: "${HISTORY_DEFAULT_WINDOW_DAYS:-90}"
      HISTORY_SNAPSHOT_RETENTION_DAYS: "${HISTORY_SNAPSHOT_RETENTION_DAYS:-30}"
      HISTORY_SNAPSHOT_SCHEDULER_ENABLED: "${HISTORY_SNAPSHOT_SCHEDULER_ENABLED:-true}"
      HISTORY_SNAPSHOT_INTERVAL_SECONDS: "${HISTORY_SNAPSHOT_INTERVAL_SECONDS:-86400}"
      HISTORY_SNAPSHOT_INITIAL_DELAY_SECONDS: "${HISTORY_SNAPSHOT_INITIAL_DELAY_SECONDS:-60}"
      FLIGHT_PROVIDER_TIMEOUT: "25"
      FLIGHT_PROVIDER_CONCURRENCY: "3"
      HOTEL_ENRICH_TIMEOUT: "35"
      HOTEL_HEADLINE_TIMEOUT: "20"
      # trvl wartet sonst intern bis 18 s je Hotelprovider. Das lässt dem
      # äußeren 20-s-Headline-Fallback keine Zeit zum Mergen/Serialisieren.
      TRVL_PROVIDER_TIMEOUT: "8s"
      GROUND_PROVIDER_TIMEOUT: "22"
      GROUND_PROVIDER_CONCURRENCY: "2"
      FLIX_GTFS_URL: "https://api.transitous.org/gtfs/eu_flixbus.gtfs.zip"
      FLIX_GTFS_DIR: /var/lib/reisevergleich/flix-gtfs
      FLIX_GTFS_MAX_AGE: "86400"
      FLIX_GTFS_TIMEOUT: "30"
      NINA_API_URL: "${NINA_API_URL:-https://warnung.bund.de/api31}"
      NINA_TIMEOUT: "${NINA_TIMEOUT:-12}"
      NINA_CACHE_TTL: "${NINA_CACHE_TTL:-300}"
      TRANSFER_PROVIDER_TIMEOUT: "20"
      TRANSFER_PROVIDER_CONCURRENCY: "2"
      TRANSITOUS_TIMEOUT: "25"
      SEARCH_DEPARTURE_TOLERANCE_MINUTES: "${SEARCH_DEPARTURE_TOLERANCE_MINUTES:-15}"
      OPENCELLID_API_KEY: "${OPENCELLID_API_KEY:-}"
      OPENCELLID_CSV_PATH: "${OPENCELLID_CSV_PATH:-}"
      OPENCELLID_SEARCH_RADIUS_KM: "${OPENCELLID_SEARCH_RADIUS_KM:-5}"
      DB_SEARCH_TIMEOUT: "50"
      DB_SPLIT_TIMEOUT: "45"
      TRIP_TIMEOUT: "210"
      TRVL_NO_TELEMETRY: "1"
      NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TRVL_DISABLE_UPDATE_CHECK: "1"
      TRVL_NO_BROWSER_COOKIES: "1"
      TRVL_NO_TIER2_CDP: "1"
      TRVL_ALLOW_BROWSER_FALLBACKS: "false"
      CI: "1"
    volumes:
      - traviorel-state:/var/lib/reisevergleich
      - traviorel-secrets:/run/traviorel-secrets:ro
    ports:
      - "${TRAVIOREL_BIND_HOST:-127.0.0.1}:${TRAVIOREL_PORT:-8791}:8000"
    networks:
      - reisevergleich
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    restart: unless-stopped

networks:
  reisevergleich:
    name: traviorel-net

volumes:
  traviorel-state:
    name: traviorel-state
  traviorel-secrets:
    name: traviorel-secrets
