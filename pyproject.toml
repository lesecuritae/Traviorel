[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traviorel"
version = "0.3.0"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "tool"}
py-modules = ["app", "db_cffi_bridge", "init_db_cffi_token"]

[tool.setuptools.packages.find]
where = ["tool"]
include = ["reisevergleich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
