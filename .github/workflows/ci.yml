name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tool/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . -r tool/requirements-test.txt
      - name: Run deterministic regression suite
        run: bash scripts/check.sh && python -m pytest -q
      - name: db-api self-tests
        # db-api's REISEVERGLEICH_SELF_TEST harness (mocked dbnav/db clients, no real network)
        # existed but nothing ever invoked it; docker-publish.yml builds and pushes this image
        # without running it either. Build the real image so vendor/ (db-vendo-client) is present
        # and run the suite against it before anything relies on this code being correct.
        run: |
          docker build -t traviorel-db-api-selftest ./db-api
          docker run --rm -e REISEVERGLEICH_SELF_TEST=1 -e DB_CFFI_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')" traviorel-db-api-selftest
